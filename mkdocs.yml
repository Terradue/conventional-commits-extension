site_name: Contextual Conventional Commits - VS Code Extension
site_description: Documentation for the Contextual Conventional Commits VS Code extension
site_url: https://terradue.github.io/conventional-commits-extension/
repo_url: https://github.com/Terradue/conventional-commits-extension
repo_name: Terradue/conventional-commits-extension
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

theme:
    logo: imgs/icon-eoap.png
    name: readthedocs

    palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

plugins:
  - search
  - mermaid2:
      version: 11.4.1
  - mkdocs-jupyter:
      execute: true
      show_input: True
      no_input: False

markdown_extensions:
  - pymdownx.details
  - abbr
  - admonition
  - footnotes
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - attr_list
  - pymdownx.snippets:
      base_path: './'
  - pymdownx.highlight:
      line_spans: __span

extra_css:
  - styles/css/app.css
  
extra_javascript:
  - javascripts/config.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Tutorial:
      - Your first conventional commit: tutorials/first-commit.md
  - How-to guides:
      - Install the extension: how-to/install.md
      - Configure a team policy: how-to/configure-policy.md
      - Record breaking changes and issue links: how-to/breaking-changes-and-footers.md
      - Validate and troubleshoot a message: how-to/validate-and-troubleshoot.md
  - Reference:
      - Commit format: reference/commit-format.md
      - Commands: reference/commands.md
      - Settings: reference/settings.md
      - Type-to-scope best practices: type-scope-best-practices.md
  - Explanation:
      - Why Conventional Commits?: explanation/why-conventional-commits.md
      - Policy and design: explanation/policy-and-design.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search

copyright: <a href="https://www.apache.org/licenses/LICENSE-2.0"><img src="https://img.shields.io/badge/license-Apache%20License%202.0-blue"" alt="Apache License, Version 2.0" /></a>
